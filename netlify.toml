[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  # Build the TanStack Start server as Netlify Functions so server functions
  # (question generation, transcription, webcam frame analysis) run in production.
  NITRO_PRESET = "netlify"

[functions]
  node_bundler = "esbuild"
